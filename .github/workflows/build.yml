name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'learnings/**'
      - 'docs/**'
      - '**/*.md'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is useless if it cannot start. This catches a missing runtime
      # dependency in the same minute rather than as a crash loop on the VPS.
      - name: Smoke test — the server boots and serves health
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # A stub vault, so boot does not depend on the real one being reachable.
          python3 -c "
          import json, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  b=json.dumps({'key':'PAGES_MCP_TOKEN','value':'ci-smoke','folder':'Root'}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
          HTTPServer(('0.0.0.0',8890),H).serve_forever()
          " &
          sleep 1

          # The production sandbox, not a bare `docker run`: read-only rootfs,
          # dropped capabilities and the real memory ceiling. Without these flags
          # a regression in any of them ships green and only fails on the VPS —
          # and the memory ceiling in particular is a number worth discovering
          # here rather than as an OOM kill mid-commit on the only copy of every
          # page. REQUIRE_MOUNT=0 because /tmp/pages is a tmpfs, not a volume.
          docker run -d --name smoke --network host \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 384m --memory-swap 512m \
            -e SECRETS_MANAGER_URL=http://127.0.0.1:8890 \
            -e SECRETS_MANAGER_TOKEN=ci \
            -e PAGES_DIR=/tmp/pages \
            -e REQUIRE_MOUNT=0 \
            -e PUBLIC_BASE=http://127.0.0.1:3013 \
            -e PORT=3013 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          for i in $(seq 1 20); do
            if curl -sf --max-time 10 http://127.0.0.1:3013/healthz > /dev/null; then echo "health ok"; break; fi
            if [ "$i" = "20" ]; then echo "never came up"; docker logs smoke; exit 1; fi
            sleep 2
          done

          # An unauthenticated call must be refused.
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3013/mcp \
            -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "expected 401 without a bearer, got $code"; exit 1; }
          echo "auth gate ok"

          # And the tool list must actually be there.
          tools=$(curl -s --max-time 30 -X POST http://127.0.0.1:3013/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer ci-smoke' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | sed -n 's/^data: //p' | python3 -c "import sys,json; print(len(json.load(sys.stdin)['result']['tools']))") || true
          [ "$tools" -eq 9 ] || { echo "expected exactly 9 tools, got $tools"; exit 1; }
          echo "tools/list ok — $tools tools"

          # ---- the visibility matrix ----
          # Every assertion below is about a page reaching someone it should not,
          # or a page becoming unrecoverable. They run here rather than in a unit
          # suite because all of them are status codes and response headers,
          # which do not exist below the route handlers — and CI already pays for
          # a running container.
          # --max-time on EVERY curl. A hung request must become a failing
          # assertion in seconds, never a job that sits until it is cancelled.
          tool() { curl -s --max-time 30 -X POST http://127.0.0.1:3013/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer ci-smoke' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" \
            | sed -n 's/^data: //p'; }
          code() { curl -s --max-time 30 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3013$1"; }
          fail() { echo "SMOKE FAIL: $1"; docker logs smoke; docker rm -f smoke > /dev/null; exit 1; }
          # Every `x=$(a | b)` below ends in `|| true` on purpose. Under
          # set -e + pipefail the assignment itself aborts the step the instant
          # any stage fails — before the `|| fail "..."` written to explain it
          # can run — so a broken assertion reports nothing at all.

          # A new page is PRIVATE and is not on the web.
          out=$(tool write_page '{"slug":"ci-secret","html":"<h1>secret</h1>","message":"ci"}')
          case "$out" in *private*) ;; *) fail "a new page was not private: $out" ;; esac
          [ "$(code /ci-secret)" = "404" ] || fail "a private page was served by slug"
          curl -s --max-time 30 http://127.0.0.1:3013/ | grep -q ci-secret && fail "a private page was listed on the index"

          # The 404 for a hidden page must be byte-identical to the 404 for a
          # missing one, or the slug is an oracle for what is stored.
          a=$(curl -s --max-time 30 http://127.0.0.1:3013/ci-secret)
          b=$(curl -s --max-time 30 http://127.0.0.1:3013/ci-nonexistent)
          [ "$a" = "$b" ] || fail "a hidden page's 404 differs from a missing page's"

          # Shared answers ONLY at its secret link.
          id=$(tool share_page '{"slug":"ci-secret","visibility":"shared"}' | grep -o '[0-9a-f]\{32\}' | head -1) || true
          [ -n "$id" ] || fail "share_page returned no share id"
          [ "$(code /s/$id)" = "200" ] || fail "the share link did not serve"
          [ "$(code /ci-secret)" = "404" ] || fail "A SHARED PAGE WAS SERVED BY SLUG"
          curl -s --max-time 30 http://127.0.0.1:3013/ | grep -q ci-secret && fail "A SHARED PAGE WAS LISTED ON THE INDEX"
          [ "$(code /s/00000000000000000000000000000000)" = "404" ] || fail "a wrong share id served a page"
          [ "$(code /s/deadbeef)" = "404" ] || fail "a malformed share id was not rejected"
          curl -sI --max-time 30 "http://127.0.0.1:3013/s/$id" | grep -qi 'cache-control: no-store' \
            || fail "the share link is cacheable"
          curl -sI --max-time 30 "http://127.0.0.1:3013/s/$id" | grep -qi 'x-robots-tag: noindex' \
            || fail "the share link is indexable"

          # REVOCATION. The single most important assertion in this file: the
          # share id is dropped from the metadata when a page goes private, and a
          # refactor that "preserves" it brings every link ever handed out back
          # to life, silently.
          tool share_page '{"slug":"ci-secret","visibility":"private"}' > /dev/null
          [ "$(code /s/$id)" = "404" ] || fail "A REVOKED SHARE LINK STILL SERVES"

          # Rotation invalidates the old link.
          id2=$(tool share_page '{"slug":"ci-secret","visibility":"shared"}' | grep -o '[0-9a-f]\{32\}' | head -1) || true
          id3=$(tool rotate_share_link '{"slug":"ci-secret"}' | grep -o '[0-9a-f]\{32\}' | head -1) || true
          [ "$id2" != "$id3" ] || fail "rotate_share_link did not change the id"
          [ "$(code /s/$id2)" = "404" ] || fail "A ROTATED-AWAY SHARE LINK STILL SERVES"
          [ "$(code /s/$id3)" = "200" ] || fail "the rotated share link does not serve"

          # PUBLISHING IS NOT THE MODEL'S TO DO. The smoke vault has no usable
          # approval channel, so this must refuse outright and change nothing —
          # never fall back to publishing.
          tool write_page '{"slug":"ci-open","html":"<h1>open</h1>","message":"ci"}' > /dev/null
          out=$(tool share_page '{"slug":"ci-open","visibility":"public"}')
          case "$out" in *Refused*) ;; *) fail "share_page published without an approval channel: $out" ;; esac
          [ "$(code /ci-open)" = "404" ] || fail "A PAGE WENT PUBLIC WITHOUT APPROVAL"
          curl -s --max-time 30 http://127.0.0.1:3013/ | grep -q ci-open && fail "an unapproved page was listed on the index"

          # An approval link that was never issued must not work.
          [ "$(code /approve/00000000000000000000000000000000)" = "404" ] || fail "an unknown approval token was accepted"
          [ "$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3013/approve/00000000000000000000000000000000)" = "404" ] \
            || fail "an unknown approval token could be spent"

          # Nothing on this host may be indexable, public pages included.
          curl -s --max-time 30 http://127.0.0.1:3013/robots.txt | grep -q 'Disallow: /' || fail "robots.txt does not disallow crawling"
          for path in / /robots.txt; do
            curl -sI --max-time 30 "http://127.0.0.1:3013$path" | grep -qi 'x-robots-tag: noindex' \
              || fail "$path is missing X-Robots-Tag: noindex"
          done

          # Reserved names cannot become pages, and GET /mcp is not a page.
          for r in mcp healthz s approve index favicon; do
            out=$(tool write_page "{\"slug\":\"$r\",\"html\":\"<h1>x</h1>\",\"message\":\"ci\"}")
            case "$out" in *Refused*) ;; *) fail "reserved slug '$r' was accepted: $out" ;; esac
          done
          [ "$(code /mcp)" = "405" ] || fail "GET /mcp is not 405"

          # Traversal is refused at the path boundary, on every tool — not just
          # on write_page, which is where the check used to live.
          case "$(tool read_page '{"slug":"../../etc/hosts"}')" in *Refused*) ;; *) fail "read_page accepted a traversal slug" ;; esac
          case "$(tool delete_page '{"slug":"../../tmp/evil","message":"ci"}')" in *Refused*) ;; *) fail "delete_page accepted a traversal slug" ;; esac
          case "$(tool write_page '{"slug":"../../tmp/evil","html":"<h1>x</h1>","message":"ci"}')" in *Refused*) ;; *) fail "write_page accepted a traversal slug" ;; esac

          # An invalid slug must come back as the refusal sentence, NOT as a
          # protocol error carrying a schema dump the model cannot act on.
          case "$(tool read_page '{"slug":"NOT A SLUG"}')" in *Refused*) ;; *) fail "an invalid slug was not refused in words" ;; esac

          # A deleted page must still be walkable, or delete_page's promise that
          # restore_page can bring it back is false.
          tool write_page '{"slug":"ci-doomed","html":"<h1>v1</h1>","message":"v1"}' > /dev/null
          tool delete_page '{"slug":"ci-doomed","message":"ci"}' > /dev/null
          case "$(tool page_history '{"slug":"ci-doomed","depth":20}')" in *commit*) ;; *) fail "the history of a deleted page is empty — restore_page cannot reach it" ;; esac

          # Six writes at once must produce six commits that are all in history.
          # Before the write queue, five of six were dangling: reported to the
          # model, absent from page_history, gone at the next gc.
          # Collect the PIDs and wait on THOSE. A bare `wait` waits for every
          # background job in the shell, and the stub vault above is one of them
          # — it runs serve_forever() and never exits, so a bare wait here hangs
          # the step until the job is cancelled. That is what burned 5h42m.
          conc_pids=()
          for n in 1 2 3 4 5 6; do
            tool write_page "{\"slug\":\"ci-conc\",\"html\":\"<h1>$n</h1>\",\"message\":\"w$n\"}" > "/tmp/conc-$n.json" &
            conc_pids+=($!)
          done
          wait "${conc_pids[@]}"
          python3 -c "
          import json, glob
          ids = set()
          for f in glob.glob('/tmp/conc-*.json'):
              r = json.load(open(f))
              ids.add(json.loads(r['result']['content'][0]['text'])['commit'])
          assert len(ids) == 6, f'expected 6 distinct commits, got {len(ids)}'
          print('concurrent writes reported', len(ids), 'commits')
          " || fail "concurrent write_page did not report six commits"
          n=$(tool page_history '{"slug":"ci-conc","depth":20}' | python3 -c "
          import sys, json
          print(len(json.loads(json.load(sys.stdin)['result']['content'][0]['text'])))
          ") || true
          [ "$n" -ge 6 ] || fail "only $n of 6 concurrent commits are in history — writes were discarded"

          # The health check must read the disk, not assert from memory: the page
          # count is the volume-loss canary.
          curl -s --max-time 30 http://127.0.0.1:3013/healthz | grep -q '"pages"' \
            || fail "/healthz does not report a page count"

          echo "visibility matrix ok"
          docker rm -f smoke > /dev/null

      - name: Report
        run: |
          set -euo pipefail
          SIZE=$(docker image inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" --format '{{.Size}}')
          {
            echo "### pages-mcp built"
            echo ""
            echo "Uncompressed size: **$(( SIZE / 1024 / 1024 )) MB**"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
