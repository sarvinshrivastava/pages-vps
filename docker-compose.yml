# pages-mcp - shared HTML pages, versioned in git, created and edited from chat.
#
# Two surfaces on one port: /mcp for the tools (bearer-authenticated) and
# /<slug> for the rendered pages (public, read-only, fronted by nginx).
#
# The port is published on 127.0.0.1 as well as the `shared` network, so nginx
# can proxy the pages — which means the vhost MUST return 404 for /mcp and
# /healthz. A default `location / { proxy_pass ... }` puts the tool endpoint on
# the public internet. See README.
#
#   SECRETS_MANAGER_TOKEN=<token> docker compose up -d

name: pages-mcp

services:
  pages-mcp:
    image: ${PAGES_IMAGE:-ghcr.io/sarvinshrivastava/pages-mcp:latest}
    container_name: pages-mcp
    restart: unless-stopped

    # Loopback only. nginx terminates TLS for the public half; 3013 is free
    # (3011 is open-webui, 3012 is bridge-mcp).
    ports:
      - '127.0.0.1:3013:3013'

    environment:
      PORT: '3013'
      PAGES_DIR: '/data/pages'
      PUBLIC_BASE: '${PUBLIC_BASE:-https://pages.vps.sarvinshrivastava.space}'
      # Caps V8's old space only. isomorphic-git allocates its inflate output
      # and blob reads as EXTERNAL buffers, which this does not bound - measured
      # 190 MB RSS at 20 pages / 200 commits with the cap set to 128.
      NODE_OPTIONS: '--max-old-space-size=256'

      # Internal, so the boot path does not run through public DNS, nginx and TLS
      # to reach a container on the same daemon.
      SECRETS_MANAGER_URL: '${SECRETS_MANAGER_URL:-http://secret-manager:8000}'
      SECRETS_MANAGER_FOLDER: '${SECRETS_MANAGER_FOLDER:-Root}'
      SECRETS_MANAGER_TOKEN: '${SECRETS_MANAGER_TOKEN:?set SECRETS_MANAGER_TOKEN in the shell, or deploy via the workflow}'

    volumes:
      # The git repo of pages. This is the only durable state in the system and
      # the one thing worth backing up.
      - pages-data:/data

    networks:
      - shared # open-webui reaches /mcp by name
      - vault # secret-manager, for the bearer at boot

    # 192m was measured at 189.5 MB RSS after 20 pages / 200 commits - a trivial
    # scale, one list_pages from the cgroup OOM-killer. The kill is not a clean
    # restart: it lands mid-git.commit, which is a non-atomic index write ->
    # loose objects -> ref update, and the only copy of every page is in there.
    mem_limit: 384m
    memswap_limit: 512m # NOT equal to mem_limit: that disables swap entirely
    # A hard quota only guarantees this service is slow when the box is idle.
    # It serves a handful of requests a day and is otherwise asleep.
    cpus: 1.0
    pids_limit: 128

    labels:
      autoheal: 'true'
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL

    # Nothing outside /data is written at runtime.
    read_only: true
    tmpfs:
      - /tmp

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3013/healthz || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pages-data:

networks:
  shared:
    external: true
  vault:
    external: true
    name: secrets-manager_default
